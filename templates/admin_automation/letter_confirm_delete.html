{% extends 'base.html' %}

{% block title %}
حذف نامه
{% endblock %}

{% block content %}

<div class="max-w-xl mx-auto">

    <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-8 text-center">

        <div class="text-5xl mb-5">
            ⚠️
        </div>

        <h1 class="text-xl font-bold text-gray-800 mb-3">
            حذف نامه
        </h1>

        <p class="text-gray-500 mb-6">
            آیا از حذف نامه
            <strong>
                {{ letter.title }}
            </strong>
            مطمئن هستید؟
        </p>


        <form method="post">

            {% csrf_token %}

            <div class="flex justify-center gap-3">

                <button
                    type="submit"
                    class="bg-red-600 hover:bg-red-700 text-white px-6 py-3 rounded-xl font-semibold"
                >
                    بله، حذف شود
                </button>

                <a
                    href="{% url 'letter_detail' letter.id %}"
                    class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-6 py-3 rounded-xl font-semibold"
                >
                    انصراف
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
