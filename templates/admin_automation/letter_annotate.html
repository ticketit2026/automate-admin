
{% extends "base.html" %}

{% block title %}حاشیه‌نویسی نامه{% endblock %}

{% block content %}
<div class="annotation-container" dir="rtl">
    <div class="toolbar no-print">
        <div class="toolbar-heading">
            <h2>حاشیه‌نویسی نامه</h2>
            <p>{{ letter.title|default:"نامه" }}</p>
        </div>

        <div class="toolbar-controls">
            <label>
                رنگ قلم
                <input type="color" id="penColor" value="#e53935">
            </label>

            <label>
                ضخامت
                <input type="range" id="penWidth" min="2" max="16" value="5">
                <span id="widthValue">5</span>
            </label>

            <button type="button" id="penBtn" class="tool-btn active">
                ✏️ قلم
            </button>

            <button type="button" id="eraserBtn" class="tool-btn">
                🧽 پاک‌کن
            </button>

            <button type="button" id="undoBtn" class="tool-btn">
                ↶ واگردانی
            </button>

            <button type="button" id="clearBtn" class="tool-btn danger">
                پاک‌کردن همه
            </button>

            <button type="button" id="saveBtn" class="tool-btn primary">
                💾 ذخیره روی PDF
            </button>

            <button type="button" id="printBtn" class="tool-btn">
                🖨️ چاپ
            </button>

            <a href="javascript:history.back()" class="tool-btn">
                بازگشت
            </a>
        </div>

        <div id="status" role="status" aria-live="polite">
            در حال بارگذاری صفحات...
        </div>
    </div>

    <div id="pages" class="pages-container"></div>

    <form id="annotationForm" method="post" enctype="multipart/form-data"
          class="hidden">
        {% csrf_token %}
        <input type="hidden" name="page_count" value="{{ page_count }}">
    </form>
</div>

<style>
.annotation-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 16px;
    color: #222;
}

.toolbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 20px;
    box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

.toolbar-heading h2 {
    margin: 0 0 6px;
    font-size: 21px;
    font-weight: 700;
}

.toolbar-heading p {
    margin: 0 0 12px;
    color: #666;
}

.toolbar-controls {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
}

.toolbar-controls label {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 13px;
}

.toolbar-controls input[type="range"] {
    width: 100px;
}

.tool-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 9px 12px;
    border: 1px solid #ccc;
    border-radius: 7px;
    background: #f8f8f8;
    color: #222;
    cursor: pointer;
    text-decoration: none;
    font-size: 13px;
    font-family: inherit;
}

.tool-btn:hover {
    background: #eaeaea;
}

.tool-btn.active {
    border-color: #2563eb;
    background: #dbeafe;
}

.tool-btn.primary {
    color: white;
    background: #1769aa;
    border-color: #1769aa;
}

.tool-btn.danger {
    color: #a21b1b;
}

.tool-btn:disabled {
    opacity: .55;
    cursor: wait;
}

#status {
    margin-top: 12px;
    font-size: 13px;
    color: #555;
}

.pages-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
}

.pdf-page {
    width: 100%;
    max-width: 1000px;
    background: white;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 5px;
    box-shadow: 0 2px 10px rgba(0,0,0,.1);
    break-after: page;
    page-break-after: always;
}

.pdf-page:last-child {
    break-after: auto;
    page-break-after: auto;
}

.page-heading {
    margin: 0 0 8px;
    color: #666;
    font-size: 13px;
}

.page-canvas-wrap {
    position: relative;
    width: 100%;
    overflow: hidden;
    background: white;
}

.page-image {
    display: block;
    width: 100%;
    height: auto;
    user-select: none;
    -webkit-user-drag: none;
}

.ink-canvas {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: crosshair;
}

@media print {
    @page {
        size: auto;
        margin: 8mm;
    }

    body {
        background: white !important;
    }

    body * {
        visibility: hidden !important;
    }

    .pages-container,
    .pages-container * {
        visibility: visible !important;
    }

    .no-print,
    .toolbar,
    #status {
        display: none !important;
    }

    .annotation-container {
        max-width: none;
        margin: 0;
        padding: 0;
    }

    .pages-container {
        display: block;
    }

    .pdf-page {
        width: 100%;
        max-width: none;
        padding: 0;
        margin: 0;
        border: 0;
        box-shadow: none;
        border-radius: 0;
        break-after: page;
        page-break-after: always;
    }

    .pdf-page:last-child {
        break-after: auto;
        page-break-after: auto;
    }

    .page-heading {
        display: none;
    }

    .page-canvas-wrap {
        width: 100%;
        overflow: visible;
    }

    .page-image,
    .ink-canvas {
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
    }
}
</style>

<script>
(function () {
    "use strict";

    const pageCount = Number("{{ page_count|escapejs }}");
    const imageUrlTemplate = "{{ page_image_url_template|escapejs }}";
    const pagesContainer = document.getElementById("pages");
    const form = document.getElementById("annotationForm");
    const statusBox = document.getElementById("status");

    const penColor = document.getElementById("penColor");
    const penWidth = document.getElementById("penWidth");
    const widthValue = document.getElementById("widthValue");

    const penBtn = document.getElementById("penBtn");
    const eraserBtn = document.getElementById("eraserBtn");
    const undoBtn = document.getElementById("undoBtn");
    const clearBtn = document.getElementById("clearBtn");
    const saveBtn = document.getElementById("saveBtn");
    const printBtn = document.getElementById("printBtn");

    let tool = "pen";
    let isSaving = false;
    const pageStates = [];

    function setStatus(message) {
        statusBox.textContent = message;
    }

    function pageImageUrl(pageNumber) {
        return imageUrlTemplate.replace(/\/1\/$/, "/" + pageNumber + "/");
    }

    function setTool(nextTool) {
        tool = nextTool;

        penBtn.classList.toggle("active", tool === "pen");
        eraserBtn.classList.toggle("active", tool === "eraser");
    }

    function makePage(pageNumber) {
        return new Promise((resolve, reject) => {
            const page = document.createElement("section");
            page.className = "pdf-page";

            const heading = document.createElement("div");
            heading.className = "page-heading";
            heading.textContent = "صفحه " + pageNumber;

            const wrap = document.createElement("div");
            wrap.className = "page-canvas-wrap";

            const image = document.createElement("img");
            image.className = "page-image";
            image.alt = "صفحه " + pageNumber + " از نامه";
            image.draggable = false;

            const canvas = document.createElement("canvas");
            canvas.className = "ink-canvas";
            canvas.setAttribute("aria-label", "حاشیه‌نویسی صفحه " + pageNumber);

            wrap.appendChild(image);
            wrap.appendChild(canvas);
            page.appendChild(heading);
            page.appendChild(wrap);
            pagesContainer.appendChild(page);

            image.onload = function () {
                canvas.width = image.naturalWidth;
                canvas.height = image.naturalHeight;

                const ctx = canvas.getContext("2d", { alpha: true });
                if (!ctx) {
                    reject(new Error("ساخت بوم حاشیه‌نویسی ناموفق بود."));
                    return;
                }

                const state = {
                    pageNumber: pageNumber,
                    canvas: canvas,
                    ctx: ctx,
                    history: [],
                    drawing: false,
                    lastX: 0,
                    lastY: 0
                };

                setupDrawing(state);
                pageStates.push(state);
                resolve(state);
            };

            image.onerror = function () {
                reject(new Error("بارگذاری صفحه " + pageNumber + " ناموفق بود."));
            };

            image.src = pageImageUrl(pageNumber);
        });
    }

    function snapshot(state) {
        state.history.push(
            state.ctx.getImageData(0, 0, state.canvas.width, state.canvas.height)
        );

        if (state.history.length > 30) {
            state.history.shift();
        }
    }

    function setupDrawing(state) {
        const canvas = state.canvas;
        const ctx = state.ctx;

        canvas.addEventListener("pointerdown", function (event) {
            if (isSaving) return;

            event.preventDefault();
            snapshot(state);

            state.drawing = true;
            canvas.setPointerCapture(event.pointerId);

            const rect = canvas.getBoundingClientRect();
            state.lastX = (event.clientX - rect.left) * canvas.width / rect.width;
            state.lastY = (event.clientY - rect.top) * canvas.height / rect.height;

            ctx.beginPath();
            ctx.arc(
                state.lastX,
                state.lastY,
                Math.max(1, Number(penWidth.value) / 2),
                0,
                Math.PI * 2
            );

            if (tool === "eraser") {
                ctx.globalCompositeOperation = "destination-out";
                ctx.fillStyle = "rgba(0,0,0,1)";
            } else {
                ctx.globalCompositeOperation = "source-over";
                ctx.fillStyle = penColor.value;
            }

            ctx.fill();
        });

        canvas.addEventListener("pointermove", function (event) {
            if (!state.drawing) return;

            event.preventDefault();

            const rect = canvas.getBoundingClientRect();
            const x = (event.clientX - rect.left) * canvas.width / rect.width;
            const y = (event.clientY - rect.top) * canvas.height / rect.height;

            ctx.beginPath();
            ctx.moveTo(state.lastX, state.lastY);
            ctx.lineTo(x, y);
            ctx.lineWidth = Number(penWidth.value);
            ctx.lineCap = "round";
            ctx.lineJoin = "round";

            if (tool === "eraser") {
                ctx.globalCompositeOperation = "destination-out";
                ctx.strokeStyle = "rgba(0,0,0,1)";
            } else {
                ctx.globalCompositeOperation = "source-over";
                ctx.strokeStyle = penColor.value;
            }

            ctx.stroke();

            state.lastX = x;
            state.lastY = y;
        });

        function finishDrawing() {
            state.drawing = false;
            ctx.globalCompositeOperation = "source-over";
        }

        canvas.addEventListener("pointerup", finishDrawing);
        canvas.addEventListener("pointercancel", finishDrawing);
        canvas.addEventListener("lostpointercapture", finishDrawing);
    }

    function canvasToBlob(canvas) {
        return new Promise((resolve, reject) => {
            canvas.toBlob(function (blob) {
                if (blob) resolve(blob);
                else reject(new Error("تبدیل حاشیه‌ها به تصویر ناموفق بود."));
            }, "image/png");
        });
    }

    penBtn.addEventListener("click", () => setTool("pen"));
    eraserBtn.addEventListener("click", () => setTool("eraser"));

    penWidth.addEventListener("input", function () {
        widthValue.textContent = penWidth.value;
    });

    undoBtn.addEventListener("click", function () {
        const state = pageStates[pageStates.length - 1];

        if (!state || state.history.length === 0) {
            setStatus("برای آخرین صفحه عملی برای واگردانی وجود ندارد.");
            return;
        }

        const previous = state.history.pop();
        state.ctx.putImageData(previous, 0, 0);
        setStatus("آخرین حرکت در صفحه " + state.pageNumber + " واگردانی شد.");
    });

    clearBtn.addEventListener("click", function () {
        if (!confirm("حاشیه‌های تمام صفحات پاک شوند؟")) return;

        pageStates.forEach(function (state) {
            snapshot(state);
            state.ctx.clearRect(0, 0, state.canvas.width, state.canvas.height);
        });

        setStatus("حاشیه‌های صفحات پاک شدند.");
    });

    saveBtn.addEventListener("click", async function () {
        if (isSaving) return;

        if (!pageStates.length || pageStates.length !== pageCount) {
            setStatus("هنوز تمام صفحات بارگذاری نشده‌اند.");
            return;
        }

        isSaving = true;
        saveBtn.disabled = true;
        printBtn.disabled = true;
        setStatus("در حال ذخیره حاشیه‌ها روی PDF اصلی...");

        try {
            const data = new FormData(form);

            for (const state of pageStates) {
                const blob = await canvasToBlob(state.canvas);
                data.append(
                    "annotation_" + state.pageNumber,
                    blob,
                    "annotation_" + state.pageNumber + ".png"
                );
            }

            const response = await fetch(window.location.href, {
                method: "POST",
                body: data,
                credentials: "same-origin",
                headers: {
                    "X-Requested-With": "XMLHttpRequest"
                }
            });

            if (!response.ok) {
                const message = await response.text();
                throw new Error(message || "ذخیره فایل ناموفق بود.");
            }

            const result = await response.json();

            if (!result.ok || !result.redirect_url) {
                throw new Error("پاسخ ذخیره فایل معتبر نیست.");
            }

            setStatus("فایل ذخیره شد؛ در حال بارگذاری نسخه نهایی...");
            window.location.href = result.redirect_url;

        } catch (error) {
            console.error(error);
            setStatus("ذخیره ناموفق بود. " + error.message);
        } finally {
            isSaving = false;
            saveBtn.disabled = false;
            printBtn.disabled = false;
        }
    });

    printBtn.addEventListener("click", function () {
        if (pageStates.length !== pageCount) {
            setStatus("ابتدا منتظر بمان تا همه صفحات بارگذاری شوند.");
            return;
        }

        window.print();
    });

    (async function init() {
        try {
            if (!Number.isInteger(pageCount) || pageCount < 1) {
                throw new Error("تعداد صفحات معتبر نیست.");
            }

            for (let number = 1; number <= pageCount; number++) {
                setStatus("در حال بارگذاری صفحه " + number + " از " + pageCount + "...");
                await makePage(number);
            }

            pageStates.sort((a, b) => a.pageNumber - b.pageNumber);
            setStatus("همه صفحات آماده‌اند. می‌توانی حاشیه‌نویسی، ذخیره یا چاپ کنی.");

        } catch (error) {
            console.error(error);
            setStatus("خطا در بارگذاری صفحات: " + error.message);
            saveBtn.disabled = true;
            printBtn.disabled = true;
        }
    })();
})();
</script>
{% endblock %}
