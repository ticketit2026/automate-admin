{% extends 'base.html' %}

{% block title %}
ثبت نامه
{% endblock %}

{% block content %}

<div class="max-w-4xl mx-auto">

    <div class="mb-6">

        <h1 class="text-2xl font-bold text-gray-800">
            ثبت نامه جدید
        </h1>

        <p class="text-sm text-gray-500 mt-2">
            اطلاعات نامه را وارد کنید.
        </p>

    </div>


    {% if messages %}

        {% for message in messages %}

        <div class="mb-4 bg-red-50 border border-red-200 text-red-700 px-5 py-4 rounded-xl text-sm">
            {{ message }}
        </div>

        {% endfor %}

    {% endif %}


    <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6">

        <form
            method="post"
            enctype="multipart/form-data"
        >

            {% csrf_token %}


            <div class="mb-5">

                <label class="block text-sm font-semibold text-gray-700 mb-2">
                    عنوان نامه
                </label>

                <input
                    type="text"
                    name="title"
                    required
                    class="w-full border border-gray-200 rounded-xl px-4 py-3"
                    placeholder="عنوان نامه"
                >

            </div>


            <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-5">


                <div>

                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        نوع نامه
                    </label>

                    <select
                        name="document_type"
                        required
                        class="w-full border border-gray-200 rounded-xl px-4 py-3"
                    >

                        <option value="in">
                            نامه وارده
                        </option>

                        <option value="out">
                            نامه صادره
                        </option>

                        <option value="internal">
                            نامه داخلی
                        </option>

                    </select>

                </div>


                <div>

                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        وضعیت
                    </label>

                    <select
                        name="status"
                        class="w-full border border-gray-200 rounded-xl px-4 py-3"
                    >

                        <option value="draft">
                            پیش‌نویس
                        </option>

                        <option value="sent">
                            ارسال شده
                        </option>

                        <option value="received">
                            دریافت شده
                        </option>

                    </select>

                </div>

            </div>


            <div class="mb-5">

                <label class="block text-sm font-semibold text-gray-700 mb-2">
                    گیرنده
                </label>

                <input
                    type="text"
                    name="sent_to"
                    class="w-full border border-gray-200 rounded-xl px-4 py-3"
                    placeholder="نام شخص یا واحد گیرنده"
                >

            </div>


            <div class="mb-5">

                <label class="block text-sm font-semibold text-gray-700 mb-2">
                    ارجاع به کاربر
                </label>

                <select
                    name="assigned_to"
                    class="w-full border border-gray-200 rounded-xl px-4 py-3"
                >

                    <option value="">
                        بدون ارجاع
                    </option>

                    {% for user in users %}

                    <option value="{{ user.id }}">
                        {{ user.username }}

                        {% if user.first_name or user.last_name %}
                            -
                            {{ user.first_name }}
                            {{ user.last_name }}
                        {% endif %}

                    </option>

                    {% endfor %}

                </select>

            </div>


            <div class="mb-5">

                <label class="block text-sm font-semibold text-gray-700 mb-2">
                    متن نامه
                </label>

                <textarea
                    name="content"
                    rows="10"
                    required
                    class="w-full border border-gray-200 rounded-xl px-4 py-3"
                    placeholder="متن نامه را وارد کنید..."
                ></textarea>

            </div>


            <div class="mb-6">

                <label class="block text-sm font-semibold text-gray-700 mb-2">
                    فایل پیوست
                </label>

                <input
                    type="file"
                    name="file"
                    class="w-full border border-gray-200 rounded-xl px-4 py-3"
                >

            </div>


            <div class="flex gap-3">

                <button
                    type="submit"
                    class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl font-semibold"
                >
                    ثبت نامه
                </button>

                <a
                    href="{% url 'letter_list' %}"
                    class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-6 py-3 rounded-xl font-semibold"
                >
                    انصراف
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
