<!DOCTYPE html>

<html lang="fa" dir="rtl">

<head>

```
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>ورود به سامانه</title>

<script src="https://cdn.tailwindcss.com"></script>
```

</head>

<body class="min-h-screen bg-gray-100 flex items-center justify-center">

```
<div class="w-full max-w-md px-5">

    <div class="bg-white rounded-3xl shadow-xl border border-gray-200 p-8">

        <!-- Logo / Icon -->

        <div class="flex justify-center mb-6">

            <div class="w-20 h-20 bg-blue-100 rounded-2xl flex items-center justify-center text-4xl">
                🏢
            </div>

        </div>


        <!-- Title -->

        <div class="text-center mb-8">

            <h1 class="text-2xl font-bold text-gray-800">
                ورود به سامانه
            </h1>

            <p class="text-gray-500 text-sm mt-2">
                لطفاً اطلاعات حساب کاربری خود را وارد کنید
            </p>

        </div>


        <!-- Login Form -->

        <form method="post">

            {% csrf_token %}


            <!-- Username -->

            <div class="mb-5">

                <label class="block text-sm font-semibold text-gray-700 mb-2">
                    نام کاربری
                </label>

                <input
                    type="text"
                    name="username"
                    required
                    autofocus
                    autocomplete="username"
                    class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                    placeholder="نام کاربری خود را وارد کنید"
                >

            </div>


            <!-- Password -->

            <div class="mb-5">

                <label class="block text-sm font-semibold text-gray-700 mb-2">
                    رمز عبور
                </label>

                <input
                    type="password"
                    name="password"
                    required
                    autocomplete="current-password"
                    class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                    placeholder="رمز عبور خود را وارد کنید"
                >

            </div>


            <!-- Error -->

            {% if form.errors %}

                <div class="bg-red-50 border border-red-200 text-red-700 rounded-xl p-3 mb-5 text-sm text-center">

                    نام کاربری یا رمز عبور اشتباه است.

                </div>

            {% endif %}


            <!-- Submit -->

            <button
                type="submit"
                class="w-full bg-blue-600 text-white py-3.5 rounded-xl font-semibold hover:bg-blue-700 active:scale-[0.99] transition"
            >
                ورود به سامانه
            </button>

        </form>


        <!-- Footer -->

        <div class="text-center mt-7">

            <p class="text-xs text-gray-400">
                سامانه مدیریت و اتوماسیون داخلی
            </p>

        </div>

    </div>

</div>
```

</body>

</html>
