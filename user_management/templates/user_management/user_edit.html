{% extends 'base.html' %}

{% block title %}
ویرایش کاربر
{% endblock %}

{% block content %}

<div class="max-w-3xl mx-auto">

    <div class="mb-6">

        <h1 class="text-2xl font-bold text-gray-800">
            ویرایش کاربر
        </h1>

        <p class="text-sm text-gray-500 mt-2">
            ویرایش اطلاعات حساب کاربری
        </p>

    </div>


    <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6">

        <form method="post">

            {% csrf_token %}


            <div class="mb-5">

                <label class="block text-sm font-semibold text-gray-700 mb-2">
                    نام کاربری
                </label>

                <input
                    type="text"
                    value="{{ user_obj.username }}"
                    disabled
                    class="w-full bg-gray-100 border border-gray-200 rounded-xl px-4 py-3 text-gray-500"
                >

            </div>


            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

                <div>

                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        نام
                    </label>

                    <input
                        type="text"
                        name="first_name"
                        value="{{ user_obj.first_name }}"
                        class="w-full border border-gray-200 rounded-xl px-4 py-3"
                    >

                </div>


                <div>

                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        نام خانوادگی
                    </label>

                    <input
                        type="text"
                        name="last_name"
                        value="{{ user_obj.last_name }}"
                        class="w-full border border-gray-200 rounded-xl px-4 py-3"
                    >

                </div>

            </div>


            <div class="mt-5">

                <label class="block text-sm font-semibold text-gray-700 mb-2">
                    ایمیل
                </label>

                <input
                    type="email"
                    name="email"
                    value="{{ user_obj.email }}"
                    class="w-full border border-gray-200 rounded-xl px-4 py-3"
                >

            </div>


            <div class="mt-6 p-4 bg-gray-50 rounded-xl">

                <label class="flex items-center gap-3 cursor-pointer">

                    <input
                        type="checkbox"
                        name="is_active"
                        {% if user_obj.is_active %}checked{% endif %}
                        class="w-5 h-5"
                    >

                    <span class="font-semibold text-gray-700">
                        حساب کاربر فعال باشد
                    </span>

                </label>

                <p class="text-xs text-gray-500 mt-2 mr-8">
                    در صورت غیرفعال بودن، کاربر نمی‌تواند وارد سامانه شود.
                </p>

            </div>


            <div class="flex items-center gap-3 mt-8">

                <button
                    type="submit"
                    class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl font-semibold"
                >
                    ذخیره تغییرات
                </button>

                <a
                    href="{% url 'user_management' %}"
                    class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-6 py-3 rounded-xl font-semibold"
                >
                    انصراف
                </a>

            </div>


        </form>

    </div>

</div>

{% endblock %}
