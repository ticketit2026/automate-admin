{% extends 'base.html' %}

{% block title %}
تغییر رمز عبور
{% endblock %}

{% block content %}

<div class="max-w-3xl mx-auto">

    <div class="mb-6">

        <h1 class="text-2xl font-bold text-gray-800">
            تغییر رمز عبور
        </h1>

        <p class="text-sm text-gray-500 mt-2">
            تغییر رمز عبور کاربر
            <span class="font-semibold text-gray-700">
                {{ user_obj.username }}
            </span>
        </p>

    </div>


    {% if messages %}

        {% for message in messages %}

        <div class="mb-4 bg-red-50 border border-red-200 text-red-700 px-5 py-4 rounded-xl text-sm">
            {{ message }}
        </div>

        {% endfor %}

    {% endif %}


    <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6">

        <form method="post">

            {% csrf_token %}


            <div class="mb-5">

                <label class="block text-sm font-semibold text-gray-700 mb-2">
                    نام کاربری
                </label>

                <input
                    type="text"
                    value="{{ user_obj.username }}"
                    disabled
                    class="w-full bg-gray-100 border border-gray-200 rounded-xl px-4 py-3 text-gray-500"
                >

            </div>


            <div class="mb-5">

                <label class="block text-sm font-semibold text-gray-700 mb-2">
                    رمز عبور جدید
                </label>

                <input
                    type="password"
                    name="password"
                    required
                    class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:outline-none"
                    placeholder="رمز عبور جدید را وارد کنید"
                >

            </div>


            <div class="mb-6">

                <label class="block text-sm font-semibold text-gray-700 mb-2">
                    تکرار رمز عبور
                </label>

                <input
                    type="password"
                    name="password_confirm"
                    required
                    class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:outline-none"
                    placeholder="رمز عبور را دوباره وارد کنید"
                >

            </div>


            <div class="flex items-center gap-3">

                <button
                    type="submit"
                    class="bg-purple-600 hover:bg-purple-700 text-white px-6 py-3 rounded-xl font-semibold transition"
                >
                    تغییر رمز عبور
                </button>

                <a
                    href="{% url 'user_management' %}"
                    class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-6 py-3 rounded-xl font-semibold transition"
                >
                    انصراف
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
